name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --locked
      - name: Run the test suite
        run: uv run python -m pytest -q
      - name: Lint
        run: uv run --with ruff ruff check .
